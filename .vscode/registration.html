<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            background:linear-gradient(135deg,#0f172a,#2563eb);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{

            width:900px;
            max-width:100%;

            background:rgba(255,255,255,.12);

            backdrop-filter:blur(20px);

            border-radius:20px;

            padding:40px;

            color:white;

            box-shadow:0 20px 40px rgba(0,0,0,.3);

        }

        h1{

            text-align:center;

            margin-bottom:30px;

        }

        .grid{

            display:grid;

            grid-template-columns:repeat(2,1fr);

            gap:20px;

        }

        .input-box{

            display:flex;

            flex-direction:column;

        }

        label{

            margin-bottom:8px;

            font-weight:600;

        }

        input,
        select,
        textarea{

            padding:12px;

            border:none;

            outline:none;

            border-radius:10px;

            font-size:15px;

        }

        textarea{

            resize:none;

        }

        .full{

            grid-column:1/3;

        }

        .buttons{

            margin-top:30px;

            display:flex;

            justify-content:center;

            gap:20px;

        }

        button{

            padding:15px 35px;

            border:none;

            border-radius:30px;

            cursor:pointer;

            font-size:16px;

            font-weight:bold;

            transition:.3s;

        }

        .preview{

            background:#10b981;

            color:white;

        }

        .reset{

            background:#ef4444;

            color:white;

        }

        button:hover{

            transform:scale(1.05);

        }

        @media(max-width:768px){

            .grid{

                grid-template-columns:1fr;

            }

            .full{

                grid-column:1;

            }

        }

    </style>

</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form id="registrationForm">

<div class="grid">

<div class="input-box">

<label>Full Name</label>

<input
type="text"
id="name"
required>

</div>

<div class="input-box">

<label>Father's Name</label>

<input
type="text"
id="father"
required>

</div>

<div class="input-box">

<label>Mother's Name</label>

<input
type="text"
id="mother"
required>

</div>

<div class="input-box">

<label>Date of Birth</label>

<input
type="date"
id="dob"
required>

</div>

<div class="input-box">

<label>Gender</label>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="input-box">

<label>Department</label>

<select id="department">

<option>BCA</option>

<option>B.Sc</option>

<option>M.Sc Computer Science</option>

<option>B.Tech</option>

</select>

</div>

<div class="input-box">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="input-box">

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
maxlength="10"
required>

</div>

<div class="input-box">

<label>Course</label>

<input
type="text"
id="course"
required>

</div>

<div class="input-box">

<label>Semester</label>

<select id="semester">

<option>1st</option>

<option>2nd</option>

<option>3rd</option>

<option>4th</option>

</select>

</div>

<div class="input-box full">

<label>Address</label>

<textarea
id="address"
rows="4"></textarea>

</div>

<div class="input-box full">

<label>Student Photo</label>

<input
type="file"
id="photo"
accept="image/*">

</div>

</div>

<div class="buttons">

<button
type="button"
class="preview"
onclick="previewData()">

Preview

</button>

<button
type="reset"
class="reset">

Reset

</button>

</div>

</form>

</div>

<script>

function previewData(){

const student={

name:document.getElementById("name").value,

father:document.getElementById("father").value,

mother:document.getElementById("mother").value,

dob:document.getElementById("dob").value,

gender:document.getElementById("gender").value,

department:document.getElementById("department").value,

email:document.getElementById("email").value,

mobile:document.getElementById("mobile").value,

course:document.getElementById("course").value,

semester:document.getElementById("semester").value,

address:document.getElementById("address").value

};

localStorage.setItem(

"student",

JSON.stringify(student)

);

window.location.href="preview.html";

}

</script>

</body>
</html>
